name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate

      - name: Pack plugin
        run: npx streamdeck pack com.dayzserver.streamdeck.sdPlugin --output dist --force

      - uses: actions/upload-artifact@v7
        with:
          name: com.dayzserver.streamdeck-${{ github.sha }}
          path: dist/*.streamDeckPlugin
          if-no-files-found: error
